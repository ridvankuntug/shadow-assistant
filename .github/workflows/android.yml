name: Android

# Builds the Android shell (android/) around the same ui/ bundle the browser
# uses. Debug APK always; a signed release APK only when the signing secrets
# exist (never for pull requests). A push to main whose app sources changed
# since the last release also publishes a GitHub Release `vX.Y.<run>` (signed
# APK + update.json) for the in-app updater (docs/10 D7). No tag trigger: tags
# are created by the release job only.
# See android/README.md → "CI and signing" and "Releases and in-app update".

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ui/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "ui/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Event in the key: a manual run (never releases) must not replace a pending push run.
  group: android-${{ github.ref }}-${{ github.event_name }}
  # main pushes run one at a time and are never cancelled half-way (a run may be
  # publishing a release); a newer pending push run replaces an older pending one, which
  # loses nothing because the release decision compares with the last release, not with
  # the previous push. PR runs supersede each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.decide.outputs.release }}
    env:
      # Secrets cannot be used in `if:` directly; this is only "set or not".
      HAS_SIGNING: ${{ secrets.SHADOW_KEYSTORE_BASE64 != '' && secrets.SHADOW_KEYSTORE_PASSWORD != '' && secrets.SHADOW_KEY_ALIAS != '' && secrets.SHADOW_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release decision diffs against the last release's tag.
          fetch-depth: 0

      # docs/10 D7: release only for a push to main of this repository (not forks, PRs or
      # manual runs) whose app sources changed since the latest release: android/ and ui/
      # (ui/dist is copied into the APK by copyUiBundle), minus Markdown and test sources
      # that never reach the APK. Workflow-only changes build and test but do not release.
      # No release yet → release. Latest release unreadable → release with a warning (an
      # extra release is harmless: same code, higher versionCode). A release without all
      # signing secrets fails here (never an unsigned or debug-signed release).
      - name: Release decision
        id: decide
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ridvankuntug/shadow-assistant'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code="$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/releases/latest")" || code="000"
          release=true
          if [ "$code" = "200" ]; then
            tag="$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")"
            if [ -n "$tag" ] && base="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              changed="$(git diff --name-only "$base" HEAD -- android ui \
                ':(exclude,glob)**/*.md' \
                ':(exclude)android/app/src/test' \
                ':(exclude,glob)ui/src/**/*.test.ts')"
              if [ -z "$changed" ]; then
                release=false
                echo "No app changes since $tag: no release"
              else
                echo "App changes since $tag:"
                printf '%s\n' "$changed"
              fi
            else
              echo "::warning::Latest release tag '$tag' not found in git; releasing"
            fi
          elif [ "$code" = "404" ]; then
            echo "No release yet: releasing"
          else
            echo "::warning::Could not read the latest release (HTTP $code); releasing"
          fi
          if [ "$release" = "true" ] && [ "$HAS_SIGNING" != "true" ]; then
            echo "::error::A release needs all four SHADOW_* signing secrets"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle (ui/dist)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The build never downloads SDK packages itself (android.builder.sdkDownload=false).
      # The runner image ships the SDK with its licences already accepted; this only
      # adds the exact platform/build-tools the app compiles against.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      # docs/10 D1/D7: versionCode = run number; versionName = <shadowVersionBase>.<run>,
      # derived by Gradle (android/gradle.properties is its only source).
      - name: Unit tests, lint, debug APK
        working-directory: android
        # `bash ./gradlew`: works even if the executable bit was lost on a Windows checkout.
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PshadowVersionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: shadow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          SHADOW_KEYSTORE_BASE64: ${{ secrets.SHADOW_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SHADOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shadow-release.jks"

      - name: Signed release APK
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        working-directory: android
        env:
          SHADOW_KEYSTORE_PATH: ${{ runner.temp }}/shadow-release.jks
          SHADOW_KEYSTORE_PASSWORD: ${{ secrets.SHADOW_KEYSTORE_PASSWORD }}
          SHADOW_KEY_ALIAS: ${{ secrets.SHADOW_KEY_ALIAS }}
          SHADOW_KEY_PASSWORD: ${{ secrets.SHADOW_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon assembleRelease -PshadowVersionCode=${{ github.run_number }}
          # Fails the job if the APK is not properly signed. (No --print-certs: keep the certificate out of public logs.)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shadow-release.jks"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        with:
          name: shadow-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Release assets, read back from the built APK: the in-app updater trusts update.json
      # for versionCode and SHA-256 (docs/10 D3); the tag is "v" + the APK's versionName.
      - name: Release files (APK + update.json)
        if: steps.decide.outputs.release == 'true'
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          badging="$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk")"
          # First line: "package: name='…' versionCode='…' versionName='…' …"
          pkg="$(printf '%s\n' "$badging" | sed -n "1s/^package: name='\([^']*\)'.*/\1/p")"
          code="$(printf '%s\n' "$badging" | sed -n "1s/.* versionCode='\([0-9]*\)'.*/\1/p")"
          name="$(printf '%s\n' "$badging" | sed -n "1s/.* versionName='\([^']*\)'.*/\1/p")"
          # versionName must be X.Y.<run>: the updater only accepts strict vX.Y.Z tags.
          if [ "$pkg" != "app.shadowassistant.android" ] || [ "$code" != "$RUN_NUMBER" ] ||
            ! [[ "$name" =~ ^[0-9]{1,6}\.[0-9]{1,6}\.([0-9]{1,6})$ ]] || [ "${BASH_REMATCH[1]}" != "$RUN_NUMBER" ]; then
            echo "::error::Unexpected APK identity: package=$pkg versionCode=$code versionName=$name"
            exit 1
          fi
          out="$RUNNER_TEMP/release-files"
          mkdir -p "$out"
          file="shadow-v${name}.apk"
          cp "$apk" "$out/$file"
          sha="$(sha256sum "$out/$file" | cut -d' ' -f1)"
          jq -n --argjson versionCode "$code" --arg versionName "$name" --arg apk "$file" --arg sha256 "$sha" \
            '{versionCode: $versionCode, versionName: $versionName, apk: $apk, sha256: $sha256}' > "$out/update.json"
          cat "$out/update.json"

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.release == 'true'
        with:
          name: shadow-release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
          retention-days: 7

  # Publishes the GitHub Release vX.Y.<run> and creates its tag at the built commit.
  # Separate job: the only one with write access, and it never sees the signing secrets.
  release:
    name: GitHub Release
    needs: apk
    if: needs.apk.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shadow-release-files
          path: release-files

      # The tag comes from update.json (read back from the APK). A re-run reuses the run
      # number (= versionCode = tag): never replace a published release, never attach a
      # release to a tag that already exists (it could point at another commit), never
      # reuse a leftover draft (the action would keep its old assets). Only a confirmed 404
      # counts as "absent"; any other answer stops the job. Then decide "latest": the app
      # reads releases/latest only, so a lower versionCode must not become latest.
      - name: Check existing releases
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          api() {
            curl -sS -o "$2" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/$1"
          }
          name="$(jq -er '.versionName' release-files/update.json)"
          if ! [[ "$name" =~ ^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$ ]]; then
            echo "::error::Unexpected versionName in update.json"
            exit 1
          fi
          TAG="v$name"
          if [ ! -f "release-files/shadow-$TAG.apk" ]; then
            echo "::error::release-files/shadow-$TAG.apk missing"
            exit 1
          fi
          code="$(api "releases/tags/$TAG" tag.json)"
          if [ "$code" = "200" ]; then
            echo "::error::Release $TAG already exists; not replacing it"
            exit 1
          elif [ "$code" != "404" ]; then
            echo "::error::Could not check for an existing release (HTTP $code)"
            exit 1
          fi
          code="$(api "git/ref/tags/$TAG" ref.json)"
          if [ "$code" = "200" ]; then
            echo "::error::Tag $TAG already exists; not attaching a release to it"
            exit 1
          elif [ "$code" != "404" ]; then
            echo "::error::Could not check for an existing tag (HTTP $code)"
            exit 1
          fi
          # Drafts are invisible to releases/tags: scan every page of the release list.
          page=1
          while :; do
            code="$(api "releases?per_page=100&page=$page" releases.json)"
            if [ "$code" != "200" ]; then
              echo "::error::Could not list releases (HTTP $code)"
              exit 1
            fi
            if jq -e --arg t "$TAG" 'any(.[]; .tag_name == $t)' releases.json > /dev/null; then
              echo "::error::A draft release for $TAG already exists; delete it, then re-run"
              exit 1
            fi
            [ "$(jq 'length' releases.json)" -lt 100 ] && break
            page=$((page + 1))
            if [ "$page" -gt 100 ]; then
              echo "::error::Too many releases to scan for drafts"
              exit 1
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ours="$(jq -er '.versionCode' release-files/update.json)"
          latest=0
          code="$(api "releases/latest" latest.json)"
          if [ "$code" = "200" ]; then
            url="$(jq -r '.assets[] | select(.name == "update.json") | .browser_download_url' latest.json)"
            if [ -n "$url" ]; then
              curl -sSfL --max-filesize 65536 -o latest-update.json "$url"
              latest="$(jq -er '.versionCode' latest-update.json)"
            fi
          elif [ "$code" != "404" ]; then
            echo "::error::Could not read the latest release (HTTP $code)"
            exit 1
          fi
          if [ "$ours" -gt "$latest" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::versionCode $ours is not above the latest release ($latest); published without becoming latest"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # softprops v2 (action.yml input `overwrite_files`, default 'true'): with false an
      # existing asset is skipped, never deleted — the checks above already refuse that
      # case. v2 creates a draft, uploads, then publishes; the tag is created at
      # target_commitish (the built commit) on publish.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.existing.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-files/shadow-${{ steps.existing.outputs.tag }}.apk
            release-files/update.json
          fail_on_unmatched_files: true
          overwrite_files: false
          make_latest: ${{ steps.existing.outputs.make_latest }}
