org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Never let the build download SDK packages on its own: installing a package
# means accepting its licence, which only the user does (see README).
android.builder.sdkDownload=false
# The one source of versionName (docs/10 D7): "X.Y"; the patch is the versionCode
# (CI run number), so versionName = X.Y.<run> and the release tag vX.Y.<run>.
# Bump X.Y here to start a new line; versionCode alone decides "newer".
shadowVersionBase=0.1
