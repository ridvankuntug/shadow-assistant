# Shadow Assistant router (read by the Core at startup; see docs/04-router.md).
#
# This file is committed: never put real room or device names here. Patterns
# use the `<ad>` placeholder for the spoken name; the Core resolves it against
# the entities Home Assistant exposes at request time.
#
# Tiers:
#   0  no model: a pattern maps the request straight to a Home Assistant tool
#   1  cheap model (CORE_MODEL_TIER1, default haiku); may escalate to tier 2
#   2  default model (CORE_MODEL_TIER2, else CORE_MODEL, default sonnet)
#   3  CORE_MODEL_TIER3 (default opus): only requests matched by a tier-3 rule
# Requests that match no rule go to tier 1 (or tier 2 when longer than
# tier1.max_words). Rules are tried top to bottom; the first match wins.
#
# Pattern syntax (matching ignores case, punctuation, Turkish letters —
# "ışığını aç" = "ISIGINI AC" — and the filler words below):
#   word      literal word          word*     word prefix ("plan*")
#   {a|b c}   alternatives          {a|}      optional
#   {@name}   the list `groups.name` (mixable: {@open|@light-up|çalıştır})
#   <ad>      the device/place name *         any words (also none)
#   <sayi>    a number, 1..3 digits ("%50", "yüzde 50", "50'ye" → "yüzde 50"
#             / "50"); number words too ("yüzde elli", "yüzlü yap", see
#             core/src/numbers.ts); light-set rules only, values over 100 do not match
# A pattern is the whole utterance: questions ("açık mı", "açtın mı"), negative
# commands ("açma") and several sentences never match and go to the model.
#
# The permission gate applies to tier 0 exactly as to the model: levels come
# from services.yaml (read / write / confirm, confirm_inputs, CORE_READ_ONLY).
# A rule's `permission` can only raise that level, never lower it.
#
# Turn-on and turn-off rules (tools intent__HassTurnOn / intent__HassTurnOff)
# only ever switch a light or a plug (a `switch` with device_class: outlet),
# whatever their `domains` say, and never a target whose name, alias or area
# has a deny name word (learning.deny_name_words below plus the Core's own
# list, also with learning off): a switch without a device class (it may drive
# a door relay or a pump), a fan or a "Kapı rölesi" plug is resolved but not
# called, and the request goes to the model. The light-level rule
# (light__HassLightSet) applies the same deny name words (T7.w.13); its domain
# boundary is its `domains` (lights). This is a Core rule, not a setting.

version: 1

# Removed before matching (whole words only).
fillers: [lütfen, hadi, acaba, bakalım, şimdi]

# Named word lists for patterns ({@name}). Polite and indirect forms of a
# command ("yakar mısın", "yakmayı dener misin") are just more alternatives:
# the whole utterance must still be a command.
groups:
  light-word: [ışığını, ışığı, ışıklarını, ışıkları, ışık, lambayı, lambasını, lambası, lambalarını, lambaları, lamba]
  # Genitive ("ışığın seviyesini", "lambanın parlaklığını").
  light-gen: [ışığın, ışığının, ışıkların, ışıklarının, lambanın, lambasının, lambaların, lambalarının, ışık]
  open: [aç, açar mısın, açar mısınız, açabilir misin, açabilir misiniz, açın, açsana, açmayı dener misin, açmayı deneyebilir misin]
  light-up: [yak, yakar mısın, yakar mısınız, yakabilir misin, yakabilir misiniz, yakın, yaksana, yakmayı dener misin, yakmayı deneyebilir misin]
  close: [kapat, kapatır mısın, kapatır mısınız, kapatabilir misin, kapatabilir misiniz, kapatın, kapatsana, kapatmayı dener misin, kapa]
  put-out: [söndür, söndürür müsün, söndürür müsünüz, söndürebilir misin, söndürebilir misiniz, söndürün, söndürsene, söndürmeyi dener misin]
  start: [çalıştır, çalıştırır mısın, çalıştırabilir misin, çalıştırın]
  stop: [durdur, durdurur musun, durdurabilir misin, durdurun]
  level-word: [seviyesini, seviyesi, parlaklığını, parlaklığı]
  # Absolute verbs only. Relative ones (yükselt, artır, indir, düşür, azalt,
  # çıkar, çek) are left out on purpose: "yüzde 10 yükselt" means "+10", not
  # "set to 10", and the dative that would tell them apart ("%30'a indir")
  # is dropped during normalization — such requests go to the model.
  set-to: [yap, yapar mısın, yapabilir misin, yapın, ayarla, ayarlar mısın, ayarlayabilir misin, ayarlayın, ayarlamayı dener misin, getir, getirir misin, getirebilir misin]

tier1:
  # Longer requests skip tier 1: escalating them would cost a second call.
  max_words: 30
  # services: [home-assistant]   # optional: MCP servers loaded for tier 1 (default: all)

escalation:
  # Tier 1 may hand a request to tier 2 with a structured marker.
  enabled: true

direct:
  enabled: true
  # What happens when a direct call cannot be completed (name not found or
  # ambiguous, tool error, sensor missing): `fallback` hands the request to
  # tier 1 — nothing in the home was changed, and the model can match names
  # that are not literal (aliases, "the lamp next to the sofa") or ask back;
  # `reply` answers with the short message below instead. An unreachable Home
  # Assistant, a denied permission or a declined confirmation always replies.
  on_tool_error: fallback
  # Max words a spoken name may have.
  max_name_words: 4
  # Captured names that never mean a device: such requests go to the model.
  stop_names: [şunu, bunu, onu, şu, bu, o, hepsini, her şeyi, onları, bunları, şunları, ışık, ışığı, ışığını, ışıkları, ışıklarını, lamba, lambayı, lambasını, lambaları, lambalarını]
  # A captured name holding one of these words is a second clause or a
  # question, not a name ("ışığı kapat ve mutfağı aç"): go to the model.
  name_stop_words: [ve, veya, ya, sonra, ama, ile, da, de, ki, mı, mi, mu, mü, ne, neden, nasıl, kim]
  # Place names that mean the same thing. When the spoken name matches no
  # entity, its synonyms are tried (each in turn). Generic Turkish vocabulary
  # only — a home's own room names belong in Home Assistant (names/aliases).
  area_aliases:
    - [salon, oturma odası]
  # Max sensors listed in one answer.
  max_items: 4
  messages:
    not_found: Bu adla bir cihaz bulamadım.
    ambiguous: Hangi cihazı kastettiğinden emin olamadım.
    unavailable: Ev sistemine şu an ulaşamıyorum.
    failed: Bunu yapamadım.
    declined: Tamam, yapmıyorum.
    read_only: Şu an salt okuma modundayım, bunu yapamam.

# Learned tier-0 rules (docs/08 T7.w.2). After ~3 model turns that solved the
# same phrasing with the same single call, the Core suggests a rule; it runs
# only after the user approves it ("Kuralı ekle"). Learned rules come after
# every rule below, go through the same permission gate, and fall back to the
# model silently when they fail. They live in the data dir, never in this file.
# This block can only narrow what the Core allows in code: tools outside
# HassTurnOn / HassTurnOff / HassLightSet or domains outside light / switch /
# media_player are a startup error; locks, alarms, covers, valves and the like
# are never learnable; a switch is learnable only with device_class: outlet.
learning:
  enabled: true
  min_observations: 3
  max_failures: 3
  tools: [intent__HassTurnOn, intent__HassTurnOff, light__HassLightSet]
  domains: [light, switch, media_player]
  # Added to the Core's own list (kapı, kilit, garaj, alarm, kepenk, panjur,
  # vana, siren, door, lock, garage, gate, valve, shutter): a target whose name,
  # alias or area has a word starting with one ("kilidi", "kapısı"; not inside
  # a word: "clock" is not "lock") is never learned or run, and the static
  # turn-on / off and light-level rules leave it to the model. A several-word entry ("su pompası")
  # matches those words one after the other. Generic words only.
  deny_name_words: [kapı, kilit, garaj, alarm, kepenk, panjur, vana, kombi, ocak, fırın]
  # Device words that may follow the spoken name in the entity name, per domain.
  keywords:
    light: [ışık, ışığı, ışıklar, ışıkları, lamba, lambası, lambalar, lambaları, aydınlatma]
    switch: [priz, prizi, prizler, prizleri]
    media_player: [televizyon, televizyonu, tv, hoparlör, hoparlörü]
  replies:
    intent__HassTurnOn: "Tamam, {ad} açıldı."
    intent__HassTurnOff: "Tamam, {ad} kapatıldı."
    light__HassLightSet: "Tamam, {ad} yüzde {seviye} yapıldı."

rules:
  # ---------------------------------------------------------------- tier 0: lights
  # Name first ("salonun ışığını yak"), verb first ("yak salonun ışığını") or
  # name last ("ışığı kapat oturma odasının").
  - id: light-on
    tier: 0
    patterns:
      - "<ad> {@light-word} {@open|@light-up}"
      - "{@open|@light-up} <ad> {@light-word}"
      - "{@light-word} {@open|@light-up} <ad>"
    service: home-assistant
    tool: intent__HassTurnOn
    domains: [light, switch]
    keywords: [ışık, ışığı, ışıklar, ışıkları, lamba, lambası, lambalar, lambaları, aydınlatma]
    reply: "Tamam, {ad} ışığı açıldı."

  - id: light-off
    tier: 0
    patterns:
      - "<ad> {@light-word} {@close|@put-out}"
      - "{@close|@put-out} <ad> {@light-word}"
      - "{@light-word} {@close|@put-out} <ad>"
    service: home-assistant
    tool: intent__HassTurnOff
    domains: [light, switch]
    keywords: [ışık, ışığı, ışıklar, ışıkları, lamba, lambası, lambalar, lambaları, aydınlatma]
    reply: "Tamam, {ad} ışığı kapatıldı."

  # "salon ışığını %50 yap", "oturma odasında ışığın seviyesini yüzde 30'a
  # ayarla", "ışığın seviyesini %50 yap oturma odası". Lights only, and never
  # a target with a deny name word ("garaj lambası" goes to the model, T7.w.13).
  - id: light-level
    tier: 0
    patterns:
      - "<ad> {@light-word} {yüzde|} <sayi> {olarak|} {@set-to}"
      - "<ad> {@light-gen} {@level-word} {yüzde|} <sayi> {olarak|} {@set-to}"
      - "{@light-gen} {@level-word} {yüzde|} <sayi> {olarak|} {@set-to} <ad>"
      - "{@light-word} {yüzde|} <sayi> {olarak|} {@set-to} <ad>"
    service: home-assistant
    tool: light__HassLightSet
    domains: [light]
    keywords: [ışık, ışığı, ışıklar, ışıkları, lamba, lambası, lambalar, lambaları, aydınlatma]
    reply: "Tamam, {ad} ışığı yüzde {seviye} yapıldı."

  # ---------------------------------------------------------------- tier 0: other switches
  # "<ad>'ı aç", "<ad>u kapat": the name may carry an accusative suffix with
  # or without an apostrophe. Only these domains are ever touched at tier 0;
  # locks, covers, alarms and the like always go through the model. device-on
  # and device-off still list switch and fan so a name shared with a light stays
  # ambiguous, but they only switch lights and outlet switches (see the top of
  # the file).
  - id: device-on
    tier: 0
    patterns:
      - "<ad> {@open|@start}"
    service: home-assistant
    tool: intent__HassTurnOn
    domains: [light, switch, fan]
    reply: "Tamam, {ad} açıldı."

  - id: device-off
    tier: 0
    patterns:
      - "<ad> {@close|@stop}"
    service: home-assistant
    tool: intent__HassTurnOff
    domains: [light, switch, fan]
    reply: "Tamam, {ad} kapatıldı."

  # ---------------------------------------------------------------- tier 0: sensors
  - id: temperature-home
    tier: 0
    patterns:
      - "{evde|ev} {sıcaklık|ısı} {kaç|kaç derece|ne kadar|nedir|ne}"
      - "ev {sıcaklığı|ısısı} {kaç|kaç derece|ne kadar|nedir|ne}"
      - "{sıcaklık|ısı} {kaç|kaç derece|ne kadar|nedir}"
      - "ortam kaç derece"
    service: home-assistant
    tool: homeassistant__GetLiveContext
    sensor: temperature
    default_name: ev
    reply: "{ad} sıcaklığı {deger}."
    reply_many: "Sıcaklıklar: {liste}."

  - id: temperature-place
    tier: 0
    patterns:
      - "<ad> {sıcaklığı|ısısı|sıcaklık|ısı} {kaç|kaç derece|ne kadar|nedir}"
      - "<ad> kaç derece"
    service: home-assistant
    tool: homeassistant__GetLiveContext
    sensor: temperature
    reply: "{ad} sıcaklığı {deger}."
    reply_many: "Sıcaklıklar: {liste}."

  - id: humidity-home
    tier: 0
    patterns:
      - "{evde|ev} nem {kaç|ne kadar|nedir|yüzde kaç}"
      - "ev nemi {kaç|ne kadar|nedir|yüzde kaç}"
      - "nem {kaç|ne kadar|nedir|yüzde kaç}"
    service: home-assistant
    tool: homeassistant__GetLiveContext
    sensor: humidity
    default_name: ev
    reply: "{ad} nemi {deger}."
    reply_many: "Nem: {liste}."

  - id: humidity-place
    tier: 0
    patterns:
      - "<ad> {nemi|nem} {kaç|ne kadar|nedir|yüzde kaç}"
    service: home-assistant
    tool: homeassistant__GetLiveContext
    sensor: humidity
    reply: "{ad} nemi {deger}."
    reply_many: "Nem: {liste}."

  # ---------------------------------------------------------------- tier 3: explicit planning / deep analysis
  - id: deep-analysis
    tier: 3
    patterns:
      - "* {derin|derinlemesine|detaylı|ayrıntılı|kapsamlı} {analiz*|inceleme*|incele*} *"
      - "* plan {yap*|hazırla*|çıkar*|oluştur*} *"
      - "* adım adım plan* *"

  # ---------------------------------------------------------------- tier 2: clearly beyond a short answer
  - id: long-form
    tier: 2
    patterns:
      - "* {karşılaştır*|değerlendir*|analiz*} *"
      - "* {özetle*|özet çıkar*} *"
